spring:
    application:
        name: devatlas
    profiles:
        default: local

---

spring:
    config:
        activate:
            on-profile: local
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:devatlas}?createDatabaseIfNotExist=true&serverTimezone=UTC
        username: ${DB_USERNAME:devatlas_user}
        password: ${DB_PASSWORD:devatlas_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
    flyway:
        enabled: true
        locations: classpath:db/migration

mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.xuannie.devatlas

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info
